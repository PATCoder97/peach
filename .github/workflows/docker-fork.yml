name: Docker fork

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '待构建的分支、标签或提交；留空使用当前分支'
        type: string
        required: false
      publish:
        description: '验收后推送到个人 Docker Hub'
        type: boolean
        default: false
      image_tag:
        description: '个人镜像标签'
        type: string
        default: vi-en
        required: true

permissions:
  contents: read

concurrency:
  group: docker-fork-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Linux amd64 (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            target: runtime
            suffix: ''
          - variant: browser
            target: browser
            suffix: '-browser'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: 核对个人镜像目标
        if: inputs.publish
        id: target
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_SUFFIX: ${{ matrix.suffix }}
        shell: bash
        run: |
          if [[ ! "$DOCKERHUB_USERNAME" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
            echo 'DOCKERHUB_USERNAME is invalid.' >&2
            exit 1
          fi
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo 'The image tag is invalid.' >&2
            exit 1
          fi
          echo "image=$DOCKERHUB_USERNAME/peach:$IMAGE_TAG$IMAGE_SUFFIX" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: 构建候选镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: peach:fork-ci
          cache-from: type=gha,scope=docker-fork-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=docker-fork-${{ matrix.variant }}
      - name: 验收独立容器
        env:
          IMAGE_VARIANT: ${{ matrix.variant }}
        shell: bash
        run: |
          if [[ "$IMAGE_VARIANT" == browser ]]; then
            python3 scripts/smoke_docker.py peach:fork-ci --browser
          else
            python3 scripts/smoke_docker.py peach:fork-ci
          fi
      - uses: docker/login-action@v4
        if: inputs.publish
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 推送已验收的同一镜像
        if: inputs.publish
        env:
          TARGET_IMAGE: ${{ steps.target.outputs.image }}
        run: |
          docker tag peach:fork-ci "$TARGET_IMAGE"
          docker push "$TARGET_IMAGE"
