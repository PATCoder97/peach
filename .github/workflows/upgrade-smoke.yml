name: Kiểm tra nâng cấp tại chỗ trên Windows

on:
  workflow_dispatch:
    inputs:
      from_version:
        description: Phiên bản đã phát hành dùng để bắt đầu
        required: true
        default: '0.39.0'
      to_version:
        description: Phiên bản đích đã phát hành
        required: true
      to_commit:
        description: SHA đầy đủ của commit xây dựng gói đích
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.from_version }}-${{ inputs.to_version }}-${{ inputs.to_commit }}
  cancel-in-progress: false

jobs:
  overlay:
    name: ${{ matrix.kind }} / ${{ matrix.data_location }} nâng cấp tại chỗ
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kind: [zip, installer]
        data_location: [default, explicit]
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Tải gói phát hành và kiểm tra nâng cấp tại chỗ
        env:
          GH_TOKEN: ${{ github.token }}
          FROM_VERSION: ${{ inputs.from_version }}
          TO_VERSION: ${{ inputs.to_version }}
          TO_COMMIT: ${{ inputs.to_commit }}
          PACKAGE_KIND: ${{ matrix.kind }}
          DATA_LOCATION: ${{ matrix.data_location }}
        shell: pwsh
        run: |
          python -X utf8 scripts/smoke_overlay_upgrade.py --from-version "$env:FROM_VERSION" --to-version "$env:TO_VERSION" --to-commit "$env:TO_COMMIT" --kind "$env:PACKAGE_KIND" --data-location "$env:DATA_LOCATION" --apply 2>&1 | Tee-Object -FilePath overlay.log
          if ($LASTEXITCODE -ne 0) { throw 'Kiểm tra nâng cấp tại chỗ thất bại' }
      - name: Lưu kết quả kiểm tra và log lỗi
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: overlay-${{ matrix.kind }}-${{ matrix.data_location }}
          path: |
            overlay.log
            smoke-evidence/
          if-no-files-found: error
          retention-days: 14
