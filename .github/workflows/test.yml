name: Kiểm thử

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Windows runner 的 stdout 默认按本机 ANSI（cp1252）编码，而项目里的脚本和错误
# 消息大量是中文——`print(f"首尾帧审计失败：{error}")` 在 runner 上直接抛
# UnicodeEncodeError，15 个脚本类用例因此全红，本地却全绿。
#
# `tests/test_subprocess_encoding.py` 已经把这条口径写死过一次：「由 Peach 控制的
# 子进程还必须用 PYTHONIOENCODING=utf-8 固定输出端」。CI 缺的正是这一层——那条
# 测试管的是源码里怎么调 subprocess，管不到 runner 自己的 stdout。
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  workflow-lint:
    name: Kiểm tra cú pháp workflow Actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/actionlint

  plan:
    name: Lập kế hoạch kiểm tra
    needs: workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base: ${{ steps.plan.outputs.base }}
      matrix: ${{ steps.plan.outputs.matrix }}
      wheel_matrix: ${{ steps.plan.outputs.wheel_matrix }}
      wide: ${{ steps.plan.outputs.wide }}
      browser_matrix: ${{ steps.plan.outputs.browser_matrix }}
      browser: ${{ steps.plan.outputs.browser }}
      frontend: ${{ steps.plan.outputs.frontend }}
      vendor: ${{ steps.plan.outputs.vendor }}
      wheel: ${{ steps.plan.outputs.wheel }}
      docker: ${{ steps.plan.outputs.docker }}
      required_jobs: ${{ steps.plan.outputs.required_jobs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Tạo ma trận kiểm tra
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: uv run --locked --python 3.14 scripts/ci_plan.py --event "$EVENT_NAME" --base "$BASE_SHA"

  frontend-ready:
    name: Kết quả kiểm tra frontend
    needs: [plan, web-bundle, web-vendor]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Xác nhận các kiểm tra frontend đã chọn đều thành công
        env:
          RESULTS: ${{ toJSON(needs) }}
          REQUIRED_JOBS: ${{ needs.plan.outputs.required_jobs }}
        run: python scripts/ci_plan.py --verify-results --phase frontend

  wheel-build:
    name: Xây dựng gói wheel
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.wheel == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv lock --check
      - run: uv build --wheel --out-dir wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-smoke
          if-no-files-found: error
          retention-days: 7
          path: |
            wheelhouse/*.whl
            scripts/smoke_wheel.py
  wheel-smoke:
    name: Cài đặt wheel tối thiểu / ${{ matrix.os }} / ${{ matrix.python }}
    needs: [plan, wheel-build]
    if: ${{ !cancelled() && needs.wheel-build.result == 'success' && needs.plan.outputs.wheel == 'true' }}
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.wheel_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheel-smoke
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Cài đặt wheel phát hành
        shell: bash
        run: |
          python -m pip install --no-cache-dir wheelhouse/*.whl
          python -m pip check
      - name: Kiểm tra smoke bên ngoài cây mã nguồn
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/smoke_wheel.py"
  python:
    name: Kiểm thử Python / ${{ matrix.os }} / ${{ matrix.python }} / ${{ matrix.scope }} / ${{ matrix.shard_index }}
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      BASE_SHA: ${{ needs.plan.outputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Lấy mẫu tương thích cập nhật phiên bản cũ của fork
        if: github.repository != 'peach-mitao/peach'
        shell: bash
        run: |
          git fetch --no-tags https://github.com/peach-mitao/peach.git \
            refs/tags/v0.47.3:refs/tags/v0.47.3 \
            refs/tags/v0.48.0:refs/tags/v0.48.0 \
            refs/tags/v0.48.1:refs/tags/v0.48.1 \
            refs/tags/v0.48.2:refs/tags/v0.48.2 \
            refs/tags/v0.49.1:refs/tags/v0.49.1 \
            refs/tags/v0.50.0:refs/tags/v0.50.0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          check-latest: true
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # checks 只验收文档与仓库契约；运行时域保留完整工具，未知输入使用全量。
      - uses: actions/setup-node@v7
        if: matrix.runtime_tools
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cài đặt phụ thuộc frontend
        if: matrix.runtime_tools
        run: npm --prefix frontend ci
      - name: Cài đặt FFmpeg trên Linux
        if: matrix.runtime_tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb xauth
      - name: Cài đặt phụ thuộc trên Linux
        run: |
          uv sync --locked --all-extras --python python
          uv pip check --python .venv/bin/python
      - name: Chạy kiểm thử chính thức trên Linux
        shell: bash
        run: |
          mkdir -p build
          if [[ '${{ matrix.runtime_tools }}' == true ]]; then
            xvfb-run -a ./scripts/test.sh ${{ matrix.scope }} --fresh --base "$BASE_SHA" --shard-index ${{ matrix.shard_index }} --shard-count ${{ matrix.shard_count }} 2>&1 | tee build/ci-tests.log
          else
            ./scripts/test.sh ${{ matrix.scope }} --fresh --base "$BASE_SHA" --shard-index ${{ matrix.shard_index }} --shard-count ${{ matrix.shard_count }} 2>&1 | tee build/ci-tests.log
          fi
      - name: Lưu log kiểm thử từng phân mảnh
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-${{ matrix.os }}-${{ matrix.scope }}-${{ matrix.shard_index }}
          path: build/ci-tests.log
          if-no-files-found: ignore
          retention-days: 14

  web-bundle:
    name: Kiểm tra bản dựng island và frontend
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.frontend == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run typecheck
      - name: Kiểm tra nội dung frontend
        run: npm --prefix frontend run check:copy
      - name: Kiểm tra lint frontend và phạm vi quét
        run: |
          npm --prefix frontend run lint --silent -- --format=json > frontend-lint.json
          node --input-type=module -e 'import { readFileSync } from "node:fs"; import assert from "node:assert/strict"; const report = JSON.parse(readFileSync("frontend-lint.json", "utf8")); assert.deepEqual(report.diagnostics, []); assert.ok(report.number_of_files > 0, "lint phải quét ít nhất một tệp");'
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      # 产物提交进 Git，因为运行时和打包都没有 Node（ADR-0022）。一旦源码改了却忘了
      # 重新构建并提交，服务端发出去的就还是旧 island——本地跑测试也看不出来，只有
      # 在这里比一次才拦得住。
      #
      # 先 `git add -N`：光 `git diff` 只看已跟踪的文件，构建新出的产物（某个 island
      # 开始带自己的 CSS 就会多一份 peach-ui.css）是未跟踪的，那条门槛会直接放过去。
      - name: Kiểm tra web/dist khớp với mã nguồn
        run: |
          git add --intent-to-add -- web/dist
          git diff --exit-code --stat -- web/dist
      - name: npm audit (frontend)
        run: python scripts/npm_audit.py --prefix frontend

  # 每片拥有独立服务与演示库；文件内的浏览器交互保持串行。
  web-e2e:
    name: Kiểm thử hồi quy trình duyệt / ${{ matrix.index }}
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.browser == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.browser_matrix) }}
    env:
      BROWSER_FILES: ${{ matrix.files }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - name: Cài đặt FFmpeg trên Linux
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Chọn Chrome cho kiểm thử e2e
        run: echo "PEACH_E2E_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Cài đặt phụ thuộc Python
        run: uv sync --locked --all-extras --python python
      - name: Chạy kiểm thử trình duyệt của phân mảnh này
        shell: bash
        run: |
          mapfile -t peach_browser_args < <(python -c 'import json, os; print("\n".join(part for name in json.loads(os.environ["BROWSER_FILES"]) for part in ("--focus", name)))')
          ./scripts/test.sh web "${peach_browser_args[@]}"
      - name: Lưu log kiểm thử trình duyệt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-${{ matrix.index }}
          path: |
            build/agent-verification/browser/*.tap
            build/agent-verification/browser/serve.log
            build/agent-verification/browser/setup-serve.log
            build/agent-verification/browser/network/*.json
          if-no-files-found: ignore
          retention-days: 14

  web-vendor:
    name: Kiểm tra phụ thuộc frontend cố định
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.vendor == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:vendor
      - name: npm audit
        run: python scripts/npm_audit.py

  docker:
    name: Xây dựng Docker và kiểm tra smoke
    needs: plan
    if: needs.plan.outputs.docker == 'true'
    uses: ./.github/workflows/docker.yml

  verified:
    name: Kết quả kiểm tra đầy đủ
    if: always()
    needs: [plan, workflow-lint, frontend-ready, python, wheel-build, wheel-smoke, web-bundle, web-e2e, web-vendor, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Xác nhận mọi tác vụ bắt buộc đều thành công
        env:
          RESULTS: ${{ toJSON(needs) }}
          REQUIRED_JOBS: ${{ needs.plan.outputs.required_jobs }}
        run: python scripts/ci_plan.py --verify-results
