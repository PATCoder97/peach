name: Phát hành

# 手动选择 master 演练桌面制品，再选择同提交的版本标签晋级已验收制品。
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PEACH_SENTRY_DSN: ${{ vars.PEACH_SENTRY_DSN }}
  PEACH_LIBRARY_SENTRY_DSN: ${{ vars.PEACH_LIBRARY_SENTRY_DSN }}
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  validate:
    name: Kiểm tra commit phát hành và phiên bản
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Kiểm tra CI nhánh chính của commit gắn tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_tag.py --repo "$GITHUB_REPOSITORY" --verify-sha "$GITHUB_SHA"
          python -c 'import os; from pathlib import Path; from scripts.version_bump import read_version; assert os.environ["GITHUB_REF_NAME"] == "v" + read_version(Path.cwd()), "Tag không khớp với phiên bản"'
          python scripts/changelog.py --notes "${GITHUB_REF_NAME#v}" --to "$RUNNER_TEMP/release-notes.md"

  desktop-checks:
    name: Kiểm thử hồi quy đầy đủ cho ứng dụng desktop
    needs: validate
    if: github.ref_type != 'tag'
    uses: ./.github/workflows/desktop.yml

  ffmpeg:
    name: FFmpeg cho Windows và mã nguồn tương ứng
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref_type != 'tag'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Dùng lại công cụ media từ mã nguồn cố định và gói mã nguồn tương ứng
        id: media-cache
        uses: actions/cache@v6.1.0
        with:
          key: windows-media-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_ffmpeg_windows.sh', 'scripts/dav1d-mingw64.ini', 'scripts/build_untrunc_windows.sh', 'scripts/fetch_ffmpeg_sources.py', 'scripts/fetch_untrunc_sources.py', 'scripts/ffmpeg-sources.json', 'scripts/untrunc-sources.json') }}
          path: |
            build/ffmpeg-windows/ffmpeg
            build/ffmpeg-windows/ffmpeg-corresponding-source.zip
            build/untrunc-windows/untrunc
            build/untrunc-windows/untrunc-corresponding-source.zip
      - name: Cài đặt công cụ biên dịch chéo
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix mingw-w64-x86-64-dev nasm pkg-config python3 clang meson ninja-build cmake ca-certificates curl xz-utils
      - name: Xây dựng công cụ media theo phiên bản cố định
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: bash scripts/build_ffmpeg_windows.sh build/ffmpeg-windows
      - name: Xây dựng công cụ sửa chỉ mục theo phiên bản cố định
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: bash scripts/build_untrunc_windows.sh build/untrunc-windows
      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-windows
          if-no-files-found: error
          retention-days: 7
          path: |
            build/ffmpeg-windows/ffmpeg/
            build/ffmpeg-windows/ffmpeg-corresponding-source.zip
      - uses: actions/upload-artifact@v7
        with:
          name: untrunc-windows
          if-no-files-found: error
          retention-days: 7
          path: |
            build/untrunc-windows/untrunc/
            build/untrunc-windows/untrunc-corresponding-source.zip

  windows:
    name: Gói kiểm thử độc lập cho Windows x64
    runs-on: windows-latest
    needs: [ffmpeg, desktop-checks]
    if: github.ref_type != 'tag'
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Kiểm tra phiên bản phát hành
        id: version
        shell: pwsh
        run: |
          $ReleaseVersion = (Select-String -Path src/peach/__init__.py -Pattern '__version__ = "(.*)"').Matches.Groups[1].Value
          if (-not $ReleaseVersion) { throw 'Không đọc được phiên bản' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v${ReleaseVersion}") { throw 'Tag không khớp với phiên bản' }
          "version=${ReleaseVersion}" >> $env:GITHUB_OUTPUT
      - name: Cài đặt phụ thuộc xây dựng
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Tạo môi trường xây dựng
        shell: pwsh
        run: |
          uv sync --locked --all-extras --python python
          if ($LASTEXITCODE -ne 0) { throw 'Cài đặt phụ thuộc bằng uv thất bại' }
          uv pip check --python .venv/Scripts/python.exe
          if ($LASTEXITCODE -ne 0) { throw 'Kiểm tra phụ thuộc uv thất bại' }
      - name: Tải và xác minh tệp cloudflared đi kèm
        shell: pwsh
        run: '& ./scripts/fetch_cloudflared.ps1 -OutputPath "$env:RUNNER_TEMP/cloudflared.exe"'
      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg-windows
          path: ${{ runner.temp }}/ffmpeg-build
      - uses: actions/download-artifact@v8
        with:
          name: untrunc-windows
          path: ${{ runner.temp }}/untrunc-build
      - name: Chuẩn bị Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version 6.7.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Cài đặt Inno Setup thất bại' }
          }
      - name: Kiểm tra lựa chọn và bảo vệ thư mục cài đặt
        shell: pwsh
        run: '& ./scripts/test.ps1 -Scope packaging -Focus test_desktop_installer'
      - name: Xây dựng gói thư mục độc lập và bộ cài đặt
        shell: pwsh
        run: '& ./scripts/build_windows.ps1 -Installer -CloudflaredPath "$env:RUNNER_TEMP/cloudflared.exe" -FFmpegPath "$env:RUNNER_TEMP/ffmpeg-build/ffmpeg" -UntruncPath "$env:RUNNER_TEMP/untrunc-build/untrunc"'
      - name: Tải lên source map trình duyệt của bản dựng Windows
        shell: pwsh
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          if (-not $env:SENTRY_AUTH_TOKEN -or -not $env:SENTRY_ORG -or -not $env:SENTRY_PROJECT) {
            Write-Host 'Chưa cấu hình môi trường tải source map Sentry; bỏ qua bước tải lên.'
            exit 0
          }
          npm --prefix frontend run sentry:upload
          if ($LASTEXITCODE -ne 0) { throw 'Tải lên source map trình duyệt thất bại' }
      - name: Tạo gói đầy đủ, gói cập nhật ứng dụng và gói công cụ
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          & ./.venv/Scripts/python.exe scripts/package_windows_release.py --source dist/Peach --output release --version '${{ steps.version.outputs.version }}' --lite-installer
          if ($LASTEXITCODE -ne 0) { throw 'Tách gói phát hành thất bại' }
          Copy-Item 'dist/Peach-${{ steps.version.outputs.version }}-windows-x64-setup.exe' release/
          Copy-Item dist/ffmpeg-corresponding-source.zip release/
          Copy-Item dist/untrunc-corresponding-source.zip release/
          Copy-Item scripts/smoke_desktop.py release/smoke_desktop.py
          Copy-Item scripts/smoke_update_tasks.py release/smoke_update_tasks.py
          Copy-Item scripts/smoke_split_update.py release/smoke_split_update.py
          python scripts/changelog.py --notes '${{ steps.version.outputs.version }}' --to release/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'CHANGELOG.md thiếu mục cho phiên bản này; cần có ghi chú trước khi phát hành' }
          Add-Content -LiteralPath release/RELEASE_NOTES.md -Value (Get-Content -Raw -Encoding utf8 release/DOWNLOADS.md) -Encoding utf8
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-candidate
          path: release/*
          if-no-files-found: error
          retention-days: 7

  desktop-smoke:
    name: Kiểm tra chỉ từ gói đã tải xuống
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: desktop-candidate
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Kiểm tra cấu hình ban đầu và ứng dụng bên ngoài cây mã nguồn
        shell: pwsh
        run: |
          Expand-Archive -Path 'Peach-${{ needs.windows.outputs.version }}-windows-x64.zip' -DestinationPath candidate
          python smoke_desktop.py candidate/Peach/Peach.exe
          if ($LASTEXITCODE -ne 0) { throw 'Kiểm tra gói xây dựng thất bại' }
      - name: Khôi phục từ gói cập nhật và công cụ độc lập, rồi kiểm tra hoạt động
        shell: pwsh
        run: |
          python smoke_split_update.py --version '${{ needs.windows.outputs.version }}' --destination split-candidate --prepare-with-app
          if ($LASTEXITCODE -ne 0) { throw 'Các gói tách không khớp với gói đầy đủ' }
          python smoke_desktop.py split-candidate/Peach/Peach.exe
          if ($LASTEXITCODE -ne 0) { throw 'Kiểm tra hoạt động của các gói tách thất bại' }
      - name: Cài đặt im lặng, kiểm tra và gỡ bộ cài đặt
        shell: pwsh
        run: |
          $Installed = Join-Path $env:RUNNER_TEMP 'Peach 安装验收\自定义目录'
          $Setup = Start-Process -FilePath './Peach-${{ needs.windows.outputs.version }}-windows-x64-setup.exe' `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$Installed`"" -Wait -PassThru
          if ($Setup.ExitCode -ne 0) { throw "Mã thoát của bộ cài đặt: $($Setup.ExitCode)" }
          $Key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{02D9748A-78F6-4866-AC75-918177194DAB}_is1'
          $Menu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Peach.lnk'
          if (-not (Test-Path -LiteralPath $Key) -or -not (Test-Path -LiteralPath $Menu)) { throw 'Bộ cài đặt chưa đăng ký mục gỡ cài đặt hoặc mục Start Menu' }
          python smoke_desktop.py (Join-Path $Installed 'Peach.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Kiểm tra bộ cài đặt thất bại' }
          # 卸载程序会把自己复制到临时目录再运行，原进程立即返回，按目录消失判断完成。
          Start-Process -FilePath (Join-Path $Installed 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $Deadline = (Get-Date).AddSeconds(120)
          while ((Test-Path -LiteralPath $Installed) -and (Get-Date) -lt $Deadline) { Start-Sleep -Seconds 1 }
          if (Test-Path -LiteralPath $Installed) { throw 'Thư mục ứng dụng vẫn còn sau khi gỡ cài đặt' }
          if ((Test-Path -LiteralPath $Key) -or (Test-Path -LiteralPath $Menu)) { throw 'Mục đăng ký hoặc Start Menu vẫn còn sau khi gỡ cài đặt' }
      - name: Cài đặt và kiểm tra bộ cài đặt nhẹ
        shell: pwsh
        run: |
          $Installed = Join-Path $env:RUNNER_TEMP 'Peach 轻量安装验收\自定义目录'
          $Setup = Start-Process -FilePath './Peach-${{ needs.windows.outputs.version }}-windows-x64-lite-setup.exe' `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$Installed`"" -WindowStyle Hidden -Wait -PassThru
          if ($Setup.ExitCode -ne 0) { throw "Mã thoát của bộ cài đặt nhẹ: $($Setup.ExitCode)" }
          python smoke_desktop.py (Join-Path $Installed 'Peach.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Kiểm tra hoạt động của bộ cài đặt nhẹ thất bại' }
          Start-Process -FilePath (Join-Path $Installed 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -WindowStyle Hidden -Wait
          $Deadline = (Get-Date).AddSeconds(120)
          while ((Test-Path -LiteralPath $Installed) -and (Get-Date) -lt $Deadline) { Start-Sleep -Seconds 1 }
          if (Test-Path -LiteralPath $Installed) { throw 'Thư mục ứng dụng vẫn còn sau khi gỡ bộ cài đặt nhẹ' }
      - name: Kiểm tra bảo vệ tác vụ đang chạy và khôi phục sau khi nâng cấp tại chỗ
        shell: pwsh
        run: |
          python smoke_update_tasks.py candidate/Peach/Peach.exe --installer './Peach-${{ needs.windows.outputs.version }}-windows-x64-setup.exe' --apply
          if ($LASTEXITCODE -ne 0) { throw 'Kiểm tra bảo vệ và khôi phục tác vụ thất bại' }
      - name: Lưu log lỗi kiểm tra gói xây dựng
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-smoke-failure
          path: smoke-evidence/
          if-no-files-found: ignore
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }} gói kiểm thử độc lập
    needs: [validate, desktop-checks]
    if: github.ref_type != 'tag'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      ARCHFLAGS: '-arch ${{ matrix.arch }}'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Tạo môi trường xây dựng cho kiến trúc gốc
        run: |
          uv sync --locked --all-extras --python python
          uv pip check --python .venv/bin/python
          npm ci --prefix frontend
      - name: Xây dựng ứng dụng độc lập và ảnh cài đặt kéo thả
        run: .venv/bin/python scripts/build_macos_standalone.py --target-arch '${{ matrix.arch }}' --destination release
      - name: Tải lên source map trình duyệt của bản dựng macOS
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo 'Chưa cấu hình môi trường tải source map Sentry; bỏ qua bước tải lên.'
            exit 0
          fi
          npm --prefix frontend run sentry:upload
      - uses: actions/upload-artifact@v7
        with:
          name: macos-candidate-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.dmg
            scripts/smoke_macos.py
            scripts/smoke_desktop.py
            scripts/MACOS_DOWNLOADS.md

  macos-smoke:
    name: macOS ${{ matrix.arch }} Kiểm tra chỉ từ gói đã tải xuống
    needs: macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: macos-candidate-${{ matrix.arch }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Gắn ảnh cài đặt và kiểm tra ứng dụng bên ngoài cây mã nguồn
        shell: bash
        run: |
          set -euo pipefail
          image=(release/*-macos-${{ matrix.arch }}.dmg)
          test "${#image[@]}" -eq 1
          mount="$RUNNER_TEMP/Peach-install"
          mkdir -p "$mount"
          hdiutil verify "${image[0]}"
          hdiutil attach "${image[0]}" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          test "$(readlink "$mount/Applications")" = /Applications
          test -s "$mount/Peach.app/Contents/Resources/LICENSE"
          codesign --verify --deep --strict "$mount/Peach.app"
          lipo -verify_arch '${{ matrix.arch }}' "$mount/Peach.app/Contents/MacOS/Peach"
          python scripts/smoke_macos.py "$mount/Peach.app"

  release:
    name: Bản phát hành thử nghiệm trên GitHub
    if: github.ref_type == 'tag'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Kiểm tra và lấy gói diễn tập từ cùng commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/github_release_candidate.py desktop --destination release
          python scripts/github_release_candidate.py macos --destination macos-candidates
      - name: Tạo bản phát hành thử nghiệm
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          cd release
          cp ../macos-candidates/release/*.dmg .
          tail -n +4 ../macos-candidates/scripts/MACOS_DOWNLOADS.md >> RELEASE_NOTES.md
          sha256sum ./*.zip ./*-setup.exe ./*.dmg > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" ./*.zip ./*-setup.exe ./*.dmg SHA256SUMS.txt --verify-tag --prerelease --title "Peach ${VERSION#v} · Bản thử nghiệm Windows / macOS" --notes-file RELEASE_NOTES.md

  project-board:
    name: Đồng bộ phiên bản đã phát hành lên bảng dự án
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Yêu cầu đồng bộ bảng dự án
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run project-board.yml --ref master
